# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy with New + > Blueprint, pointing at this repo.
services:
  - type: web
    name: inara-course-editor
    runtime: node
    # Persistent disks need a paid instance; on the free plan every deploy or
    # restart wipes all courses and uploads.
    plan: starter
    buildCommand: npm ci && npm run build
    # Brings the database schema up to date before each new version starts.
    preDeployCommand: npm run db:migrate
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Courses, lessons and workspaces.
      - key: EDITOR_DATABASE_URL
        fromDatabase:
          name: inara-course-editor-db
          property: connectionString
      # Uploaded images (uploads/) are stored here.
      - key: DATA_DIR
        value: /var/data
      # Publishing through the Course Publishing Protocol (docs/platform-integration.md).
      # PLATFORM_URL, EDITOR_PRIVATE_KEYS (npm run keys:generate) and
      # EDITOR_PUBLIC_URL are set in the dashboard.
      - key: PLATFORM_ADAPTER
        value: protocol
      - key: PLATFORM_URL
        sync: false
      - key: EDITOR_PRIVATE_KEYS
        sync: false
      - key: EDITOR_PUBLIC_URL
        sync: false
      # Live co-editing (docs/collaboration/phase-4.md): the gateway's public
      # wss:// address, its private address for flushes, and the two secrets
      # shared with the gateway service below (at least 32 characters each).
      - key: COLLAB_PUBLIC_URL
        sync: false
      - key: COLLAB_INTERNAL_URL
        sync: false
      - key: COLLAB_TICKET_SECRET
        sync: false
      - key: COLLAB_INTERNAL_SECRET
        sync: false
      # AI generation (the C1 AI job core). Off unless AI_ENABLED is set to 1.
      # AI_WORKER_URL / AI_WORKER_SECRET connect the app to the worker below.
      - key: AI_ENABLED
        sync: false
      - key: AI_DEFAULT_PROVIDER
        sync: false
      - key: AI_WORKER_URL
        sync: false
      - key: AI_WORKER_SECRET
        sync: false
    disk:
      name: inara-data
      mountPath: /var/data
      sizeGB: 1

  # The collaboration gateway: live lesson documents over WebSocket. One
  # instance (it holds open documents in memory). Same database as the app;
  # only the app runs migrations.
  - type: web
    name: inara-course-editor-collab
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run collab
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EDITOR_DATABASE_URL
        fromDatabase:
          name: inara-course-editor-db
          property: connectionString
      - key: PLATFORM_ADAPTER
        value: protocol
      # The editor's public address: browsers from any other origin are refused.
      - key: EDITOR_PUBLIC_URL
        sync: false
      - key: COLLAB_TICKET_SECRET
        sync: false
      - key: COLLAB_INTERNAL_SECRET
        sync: false

  # The AI worker: claims queued AI jobs from the database, generates with the
  # job's provider and writes the candidate back. A background worker (no
  # inbound HTTP). Shares the database with the app; only the app migrates.
  - type: worker
    name: inara-course-editor-ai
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run ai:worker
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EDITOR_DATABASE_URL
        fromDatabase:
          name: inara-course-editor-db
          property: connectionString
      - key: AI_DEFAULT_PROVIDER
        sync: false
      - key: AI_WORKER_SECRET
        sync: false

databases:
  - name: inara-course-editor-db
    plan: basic-256mb
