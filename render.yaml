# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy with New + > Blueprint, pointing at this repo.
services:
  - type: web
    name: inara-course-editor
    runtime: node
    # Persistent disks need a paid instance; on the free plan every deploy or
    # restart wipes all courses and uploads.
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /courses
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Courses (course/) and uploads (uploads/) are stored here.
      - key: DATA_DIR
        value: /var/data
      # Publishing through the Course Publishing Protocol (docs/platform-integration.md).
      # PLATFORM_URL, the key pair and EDITOR_PUBLIC_URL are set in the dashboard.
      - key: PLATFORM_ADAPTER
        value: protocol
      - key: PLATFORM_URL
        sync: false
      - key: PLATFORM_KEY_ID
        sync: false
      - key: PLATFORM_KEY_SECRET
        sync: false
      - key: EDITOR_PUBLIC_URL
        sync: false
    disk:
      name: inara-data
      mountPath: /var/data
      sizeGB: 1
