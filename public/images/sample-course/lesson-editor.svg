<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="The lesson editor: sections with blocks, Add block, Preview and the save status">
  <rect width="960" height="600" fill="#f8fafc"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <!-- Top bar -->
    <rect width="960" height="96" fill="#ffffff"/>
    <rect y="95" width="960" height="1" fill="#e2e8f0"/>
    <text x="32" y="44" font-size="15" fill="#64748b">‹ Course</text>
    <text x="32" y="70" font-size="20" font-weight="700" fill="#0f172a">Writing with text and images</text>
    <rect x="680" y="30" width="80" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="720" y="53" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">Preview</text>
    <rect x="820" y="30" width="108" height="36" rx="18" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
    <text x="874" y="53" text-anchor="middle" font-size="15" font-weight="600" fill="#047857">✓ Saved</text>
    <!-- Section -->
    <rect x="96" y="120" width="768" height="384" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="120" y="156" font-size="18" font-weight="700" fill="#0f172a">Section 1 · Rich text</text>
    <rect x="644" y="138" width="20" height="20" rx="4" fill="#4f46e5"/>
    <path d="M649 148 l4 4 l7 -8" stroke="#ffffff" stroke-width="2.5" fill="none"/>
    <text x="672" y="154" font-size="14" fill="#475569">Required to advance</text>
    <!-- Block: rich text -->
    <rect x="120" y="186" width="720" height="146" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <text x="140" y="212" font-size="12" font-weight="700" letter-spacing="1.5" fill="#4f46e5">RICH TEXT</text>
    <g fill="#94a3b8" font-size="13">
      <text x="664" y="212">↑</text><text x="688" y="212">↓</text><text x="712" y="212">Duplicate</text><text x="784" y="212">Delete</text>
    </g>
    <rect x="140" y="230" width="300" height="16" rx="8" fill="#334155"/>
    <rect x="140" y="260" width="660" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="140" y="280" width="620" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="140" y="300" width="480" height="10" rx="5" fill="#e2e8f0"/>
    <!-- Block: image -->
    <rect x="120" y="348" width="720" height="136" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="140" y="374" font-size="12" font-weight="700" letter-spacing="1.5" fill="#64748b">IMAGE</text>
    <rect x="140" y="388" width="170" height="80" rx="8" fill="#eef2ff"/>
    <path d="M160 456 l40 -40 l30 30 l20 -20 l40 30 z" fill="#a5b4fc"/>
    <circle cx="280" cy="410" r="10" fill="#c7d2fe"/>
    <rect x="330" y="404" width="260" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="330" y="428" width="200" height="10" rx="5" fill="#e2e8f0"/>
    <!-- Add block -->
    <rect x="400" y="510" width="160" height="38" rx="19" fill="#4f46e5"/>
    <text x="480" y="534" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">+ Add block</text>
  </g>
</svg>
