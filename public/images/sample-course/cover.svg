<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Start here: a tour of the course editor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g fill="#ffffff" fill-opacity="0.08">
    <circle cx="1080" cy="80" r="220"/>
    <circle cx="140" cy="640" r="180"/>
  </g>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="80" y="250" fill="#c7d2fe" font-size="34" font-weight="600" letter-spacing="4">START HERE</text>
    <text x="80" y="330" fill="#ffffff" font-size="64" font-weight="800">A tour of the</text>
    <text x="80" y="408" fill="#ffffff" font-size="64" font-weight="800">course editor</text>
    <text x="80" y="470" fill="#e0e7ff" font-size="28">Every kind of block, and when to use it</text>
  </g>
  <!-- A stack of lesson blocks -->
  <g transform="translate(760 150)">
    <rect x="0" y="0" width="340" height="380" rx="24" fill="#ffffff"/>
    <rect x="28" y="30" width="180" height="18" rx="9" fill="#c7d2fe"/>
    <rect x="28" y="62" width="284" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="28" y="82" width="250" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="28" y="116" width="134" height="96" rx="12" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
    <rect x="178" y="116" width="134" height="96" rx="12" fill="#4f46e5"/>
    <text x="95" y="171" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#4338ca">Term</text>
    <text x="245" y="171" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Meaning</text>
    <circle cx="44" cy="252" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
    <rect x="66" y="246" width="180" height="12" rx="6" fill="#e2e8f0"/>
    <circle cx="44" cy="290" r="10" fill="#4f46e5"/>
    <rect x="66" y="284" width="210" height="12" rx="6" fill="#c7d2fe"/>
    <circle cx="44" cy="328" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
    <rect x="66" y="322" width="150" height="12" rx="6" fill="#e2e8f0"/>
  </g>
</svg>
